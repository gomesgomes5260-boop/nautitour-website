<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Molde HF — arte gerada + texto/logo exatos por cima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap">
<style>
  :root { --ee-petroleo: #075A5E; --ee-offwhite: #E9E6DF; --ee-turquesa-clara: #5FB3B8; --font: "Poppins", "Montserrat", sans-serif; --W: 1080px; --H: 1350px; }
  html, body { margin: 0; padding: 0; background: #000; }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: var(--W); height: var(--H); overflow: hidden; background: #0F5F63; }
  .base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* zonas: caixas em % da arte onde o texto e a logo entram (vêm do spec) */
  .zone { position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: .3em; }
  .zone.left { align-items: flex-start; text-align: left; }
  .title { font-weight: 700; line-height: 1.04; letter-spacing: -.005em; color: var(--ee-offwhite); text-wrap: balance; text-shadow: 0 2px 10px rgba(7,42,46,.45); }
  .fact { font-weight: 600; line-height: 1.25; color: var(--ee-turquesa-clara); text-shadow: 0 1px 6px rgba(7,42,46,.4); }
  .cta { margin-top: .5em; background: #fff; color: var(--ee-petroleo); font-weight: 700; line-height: 1; padding: .62em 1.15em; border-radius: 999px; box-shadow: 0 8px 20px rgba(7,42,46,.35); white-space: nowrap; display: inline-flex; align-items: center; gap: .45em; }
  .cta .ico { width: 1.05em; height: 1.05em; }
  .logos { position: absolute; display: flex; align-items: center; justify-content: center; gap: 36px; }
  .logos svg { height: auto; display: block; }
  /* polaroides montadas no molde: foto + borda branca rasgada + legenda na borda, tudo gira junto */
  .pol-wrap { position: absolute; filter: drop-shadow(0 10px 14px rgba(7,42,46,.35)) drop-shadow(0 2px 3px rgba(7,42,46,.25)); transform-origin: center; }
  .pol { background: #F3F1EA; position: relative; box-sizing: border-box; }
  .pol-photo { width: 100%; display: block; object-fit: cover; }
  .pol-cap { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 600; color: var(--ee-petroleo); line-height: 1.1; padding: 0 4%; }
  /* polaroide pintada na arte: a foto escolhida cobre o quadro medido (quadros.json) e a legenda cai na borda inferior */
  .q-wrap { position: absolute; transform-origin: center; overflow: hidden; }
  .q-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .q-cap { position: absolute; transform-origin: center; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 600; color: var(--ee-petroleo); line-height: 1.1; padding: 0 3%; box-sizing: border-box; }
  .rotulo { position: absolute; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--ee-petroleo); text-align: center; line-height: 1.1; }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="base" id="base" alt="">
  <div class="zone" id="zone"><div class="title" id="title"></div><div class="fact" id="fact"></div><div class="cta" id="cta"></div></div>
  <div class="logos" id="logos"></div>
  <div id="rotulos"></div>
  <div id="polaroides"></div>
</div>
<script>
  // SPEC vem do renderizador. Zonas em % (x, y, w, h). Defaults batem com a arte base "foto + faixa" 4:5.
  const SPEC = window.SPEC || {};
  const F = { '4x5': { W: 1080, H: 1350 }, '1x1': { W: 1080, H: 1080 }, '9x16': { W: 1080, H: 1920 }, '1200x628': { W: 1200, H: 628 } };
  const f = F[SPEC.formato] || F['4x5'];
  document.documentElement.style.setProperty('--W', f.W + 'px'); document.documentElement.style.setProperty('--H', f.H + 'px');
  const Z = Object.assign({ texto: { x: 6, y: 60, w: 88, h: 24, alinhar: 'centro', titulo: 7.4, fato: 3.1, cta: 3.0 }, logo: { x: 30, y: 87, w: 40, h: 9 } }, SPEC.zonas || {});
  const pct = (el, z) => { el.style.left = z.x + '%'; el.style.top = z.y + '%'; el.style.width = z.w + '%'; el.style.height = z.h + '%'; };
  const base = document.getElementById('base'); base.src = SPEC.baseSrc || '';
  const zone = document.getElementById('zone'); pct(zone, Z.texto); if (Z.texto.alinhar === 'esquerda') zone.classList.add('left');
  // tamanhos em % da largura da arte: independem do formato
  const vw = (p) => (f.W * p / 100) + 'px';
  const title = document.getElementById('title'); title.textContent = SPEC.titulo || ''; title.style.fontSize = vw(Z.texto.titulo);
  const fact = document.getElementById('fact'); if (SPEC.fato) { fact.textContent = SPEC.fato; fact.style.fontSize = vw(Z.texto.fato); } else fact.remove();
  const cta = document.getElementById('cta');
  if (SPEC.cta && SPEC.cta.texto) { const wa = SPEC.cta.tipo === 'whatsapp'; cta.style.fontSize = vw(Z.texto.cta); cta.innerHTML = (wa ? '<svg class="ico" viewBox="0 0 24 24" fill="#25D366"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4 5.3 5.3 0 0 0 3.2.7 2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>' : '') + '<span></span>'; cta.querySelector('span').textContent = SPEC.cta.texto; if (wa) cta.style.color = '#1E8B4C'; } else cta.remove();
  const logos = document.getElementById('logos'); pct(logos, Z.logo);
  logos.innerHTML = `<div class="logo-ee">${SPEC.logoEE || ''}</div>` + (SPEC.assinatura === 'escuna+nautitour' ? `<div class="logo-nt">${SPEC.logoNT || ''}</div>` : '');
  const n = logos.children.length; [...logos.children].forEach(d => { d.style.width = (n === 1 ? 100 : 48) + '%'; const s = d.querySelector('svg'); if (s) { s.removeAttribute('width'); s.removeAttribute('height'); s.style.width = '100%'; s.style.maxHeight = '100%'; } });
  if (SPEC.assinatura === 'nenhuma') logos.remove();
  // polaroides: [{fotoSrc, x, y, w, prop:'1 / 1', girar, legenda, tamanho, seed}] — x/y/w em % da arte, w = largura da polaroide
  let ps = (SPEC.seed || 1) * 7919 + 104729; const prnd = () => { ps = (ps * 9301 + 49297) % 233280; return ps / 233280; };
  const tornPoly = (W, H, amp, n) => { const pts = []; const edge = (x0, y0, x1, y1, inward) => { for (let i = 0; i <= n; i++) { const t = i / n; const x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t; const d = (Math.sin(t * 17 + prnd() * 6) * .5 + (prnd() - .5)) * amp; pts.push([x + inward[0] * d, y + inward[1] * d]); } };
    edge(0, 0, W, 0, [0, 1]); edge(W, 0, W, H, [-1, 0]); edge(W, H, 0, H, [0, -1]); edge(0, H, 0, 0, [1, 0]);
    return 'polygon(' + pts.map(p => `${Math.max(0, Math.min(W, p[0])).toFixed(1)}px ${Math.max(0, Math.min(H, p[1])).toFixed(1)}px`).join(',') + ')'; };
  const polBox = document.getElementById('polaroides');
  (SPEC.polaroides || []).forEach((pz, i) => {
    if (pz.quadro) { // polaroide pintada: {quadro:{foto:{cx,cy,w,h},girar,borda:{baixo}}, fotoSrc, legenda, tamanho, fotoPos}
      const q = pz.quadro, over = 3; // 3px a mais por lado pra cobrir a foto pintada até a borda
      const W = f.W * q.foto.w / 100 + 2 * over, H = f.H * q.foto.h / 100 + 2 * over, cx = f.W * q.foto.cx / 100, cy = f.H * q.foto.cy / 100;
      const wrap = document.createElement('div'); wrap.className = 'q-wrap'; wrap.style.left = (cx - W / 2) + 'px'; wrap.style.top = (cy - H / 2) + 'px'; wrap.style.width = W + 'px'; wrap.style.height = H + 'px'; wrap.style.transform = `rotate(${q.girar}deg)`;
      const im = document.createElement('img'); im.className = 'pol-photo'; im.alt = ''; im.src = pz.fotoSrc || ''; if (pz.fotoPos) im.style.objectPosition = pz.fotoPos; wrap.appendChild(im); polBox.appendChild(wrap);
      if (pz.legenda) { const bB = f.W * q.borda.baixo / 100; const r = q.girar * Math.PI / 180; const dx = -Math.sin(r) * (H / 2 - over + bB / 2), dy = Math.cos(r) * (H / 2 - over + bB / 2);
        const cap = document.createElement('div'); cap.className = 'q-cap'; cap.style.width = (W - 2 * over) + 'px'; cap.style.height = bB + 'px'; cap.style.left = (cx + dx - (W - 2 * over) / 2) + 'px'; cap.style.top = (cy + dy - bB / 2) + 'px'; cap.style.transform = `rotate(${q.girar}deg)`; cap.style.fontSize = vw(pz.tamanho || 2.4); cap.textContent = pz.legenda; polBox.appendChild(cap); }
      return;
    }
    const W = f.W * (pz.w || 40) / 100; const [pw, ph] = String(pz.prop || '1 / 1').split('/').map(Number); const border = W * .045; const bottom = W * (pz.legenda ? .17 : .07);
    const photoW = W - 2 * border; const photoH = photoW * (ph / pw); const H = photoH + border + bottom;
    const wrap = document.createElement('div'); wrap.className = 'pol-wrap'; wrap.style.left = (f.W * pz.x / 100) + 'px'; wrap.style.top = (f.H * pz.y / 100) + 'px'; wrap.style.width = W + 'px'; wrap.style.height = H + 'px'; wrap.style.transform = `rotate(${pz.girar || 0}deg)`;
    const pol = document.createElement('div'); pol.className = 'pol'; pol.style.width = W + 'px'; pol.style.height = H + 'px'; pol.style.padding = `${border}px ${border}px ${bottom}px`; pol.style.clipPath = tornPoly(W, H, W * .012, 90);
    const im = document.createElement('img'); im.className = 'pol-photo'; im.alt = ''; im.src = pz.fotoSrc || ''; im.style.height = photoH + 'px'; if (pz.fotoPos) im.style.objectPosition = pz.fotoPos; pol.appendChild(im);
    if (pz.legenda) { const cap = document.createElement('div'); cap.className = 'pol-cap'; cap.style.top = (border + photoH) + 'px'; cap.style.height = bottom + 'px'; cap.style.fontSize = vw(pz.tamanho || 2.4); cap.textContent = pz.legenda; pol.appendChild(cap); }
    wrap.appendChild(pol); polBox.appendChild(wrap); wrap.dataset.i = i;
  });
  // rótulos (enquete): caixas pequenas em % com texto em petróleo, tamanho em % da largura
  const rot = document.getElementById('rotulos');
  (Z.rotulos || []).forEach(z => { const d = document.createElement('div'); d.className = 'rotulo'; pct(d, z); d.style.fontSize = vw(z.tamanho || 2.6); if (z.girar) d.style.transform = `rotate(${z.girar}deg)`; d.textContent = z.texto || ''; rot.appendChild(d); });
  const waitImg = (im) => new Promise(res => { if (im.complete) res(); else { im.onload = res; im.onerror = res; } });
  window.__ready = Promise.all([document.fonts.ready, waitImg(base), ...[...document.querySelectorAll('.pol-photo')].map(waitImg)]);
</script>
</body>
</html>
