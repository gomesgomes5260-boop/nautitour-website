<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Molde A — Foto + faixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap">
<style>
  /* Tokens da Escuna Estrela (docs/brand/sistema-visual-social.md) */
  :root {
    --ee-petroleo: #075A5E; --ee-petroleo-escuro: #072A2E; --ee-turquesa: #09959C; --ee-turquesa-clara: #5FB3B8;
    --ee-kraft: #E7E5DD; --ee-kraft-escuro: #D0C9B8; --ee-offwhite: #E9E6DF; --ee-estrela: #20C098;
    --font: "Poppins", "Montserrat", sans-serif;
    /* preenchidos pelo renderizador */
    --W: 1080px; --H: 1350px; --hero-h: 62%; --sea-top: 56%; --sea-bottom: 86%; --title-size: 86px; --fact-size: 36px; --cta-size: 34px; --logo-w: 230px; --safe: 60px;
  }
  html, body { margin: 0; padding: 0; background: #000; }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: var(--W); height: var(--H); overflow: hidden; background: var(--ee-kraft); }
  /* papel kraft: cor + grão (ruído) + leve vinheta */
  .kraft { position: absolute; inset: 0; background: var(--ee-kraft); }
  .kraft::after { content: ""; position: absolute; inset: 0; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45 0 0 0 0 0.42 0 0 0 0 0.35 0 0 0 0.55 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); opacity: .42; mix-blend-mode: multiply; }
  .kraft-vignette { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(120,105,80,.18) 100%); }
  /* foto hero */
  .hero { position: absolute; left: 0; top: 0; width: 100%; height: var(--hero-h); overflow: hidden; }
  .hero img { width: 100%; height: 100%; object-fit: cover; object-position: var(--hero-pos, 50% 50%); display: block; }
  /* bloco de mar: SVG com bordas rasgadas, degradê e sombra */
  .sea { position: absolute; left: -2%; top: calc(var(--sea-top) - 4%); width: 104%; height: calc(var(--sea-bottom) - var(--sea-top) + 8%); filter: drop-shadow(0 -6px 10px rgba(7,42,46,.35)) drop-shadow(0 10px 14px rgba(7,42,46,.35)); }
  .sea svg { width: 100%; height: 100%; display: block; }
  /* marca d'água: rosa dos ventos em traço */
    /* rosa dos ventos de madeira (reconstruída em SVG; trocar pelo PNG original quando sair do PSD) */
  .wood { position: absolute; width: 27%; aspect-ratio: 1; right: -10%; bottom: calc(100% - var(--sea-bottom) - 8%); filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); transform: rotate(-12deg); }
  .wood svg { width: 100%; height: 100%; }
  /* textos */
  .copy { position: absolute; left: var(--safe); right: var(--safe); top: calc(var(--sea-top) + 4.5%); bottom: calc(100% - var(--sea-bottom) + 2.5%); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: .35em; }
  .title { font-weight: 700; font-size: var(--title-size); line-height: 1.02; letter-spacing: -.01em; color: var(--ee-offwhite); text-wrap: balance; max-width: 92%; text-shadow: 0 2px 6px rgba(7,42,46,.25); }
  .fact { font-weight: 600; font-size: var(--fact-size); line-height: 1.25; color: var(--ee-turquesa-clara); max-width: 88%; }
  /* rodapé no kraft: CTA + assinatura */
  .foot { position: absolute; left: var(--safe); right: var(--safe); top: var(--sea-bottom); bottom: var(--safe); display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .foot.center { flex-direction: column; justify-content: center; gap: 18px; }
  .cta { background: #fff; color: var(--ee-petroleo); font-weight: 700; font-size: var(--cta-size); line-height: 1; padding: .62em 1.1em; border-radius: 999px; box-shadow: 0 6px 18px rgba(7,42,46,.18); white-space: nowrap; display: inline-flex; align-items: center; gap: .45em; }
  .cta .ico { width: 1.05em; height: 1.05em; }
  .logos { display: flex; align-items: center; gap: 36px; }
  .logos svg, .logos img { height: auto; display: block; }
  .logo-ee { width: var(--logo-w); }
  .logo-nt { width: calc(var(--logo-w) * .98); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="kraft"></div><div class="kraft-vignette"></div>
  <div class="hero"><img id="hero" alt=""></div>
  <div class="sea"><svg id="sea" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#072A2E"/><stop offset=".45" stop-color="#075A5E"/><stop offset="1" stop-color="#09959C"/></linearGradient></defs><clipPath id="seaClip"><path id="seaClipPath"/></clipPath></defs><path id="seaEdge" fill="none" stroke="#E9E6DF" stroke-width="7" stroke-linejoin="round"/><path id="seaPath" fill="url(#g)"/><g clip-path="url(#seaClip)" id="wm" fill="none" stroke="#E9E6DF" stroke-width="1.6" opacity=".13"><g id="wmInner"><circle cx="200" cy="200" r="150"/><circle cx="200" cy="200" r="118"/><circle cx="200" cy="200" r="34"/><g id="ticks"></g><path d="M200 40 L214 186 L360 200 L214 214 L200 360 L186 214 L40 200 L186 186 Z"/><path d="M200 60 L230 170 L340 200 L230 230 L200 340 L170 230 L60 200 L170 170 Z" stroke-width=".9"/><path d="M200 200 L300 100 M200 200 L100 100 M200 200 L300 300 M200 200 L100 300" stroke-width=".9"/></g></g></svg></div>
  <div class="wood"><svg viewBox="0 0 200 200"><defs><radialGradient id="w" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#C9955A"/><stop offset=".6" stop-color="#9A6A3A"/><stop offset="1" stop-color="#6E4523"/></radialGradient></defs><circle cx="100" cy="100" r="78" fill="url(#w)" stroke="#5A371A" stroke-width="4"/><circle cx="100" cy="100" r="64" fill="none" stroke="#5A371A" stroke-width="3"/><g id="wticks" stroke="#5A371A" stroke-width="3"></g><path d="M100 10 L112 88 L190 100 L112 112 L100 190 L88 112 L10 100 L88 88 Z" fill="#7C4E27" stroke="#4A2B12" stroke-width="3"/><path d="M100 10 L112 88 L100 100 Z M190 100 L112 112 L100 100 Z M100 190 L88 112 L100 100 Z M10 100 L88 88 L100 100 Z" fill="#D9A86B"/><path d="M100 36 L108 92 L164 100 L108 108 L100 164 L92 108 L36 100 L92 92 Z" fill="#C98B4E" stroke="#4A2B12" stroke-width="2" transform="rotate(45 100 100)"/><circle cx="100" cy="100" r="8" fill="#4A2B12"/></svg></div>
  <div class="copy"><div class="title" id="title"></div><div class="fact" id="fact"></div></div>
  <div class="foot" id="foot"><div class="logos" id="logos"></div><div class="cta" id="cta"></div></div>
</div>
<script>
  // Preenchido pelo renderizador via window.SPEC. Mantém um fallback pra abrir o arquivo direto no navegador.
  const SPEC = window.SPEC || { formato: '4x5', titulo: 'Sáb e dom, 9h30 e 12h.', fato: '12 praias, 3 ilhas, 2h30. R$ 60 por pessoa.', cta: { texto: 'Reserve pelo link', tipo: 'site' }, assinatura: 'escuna', seed: 7 };
  const F = { '4x5': { W: 1080, H: 1350, hero: 62, seaTop: 56, seaBottom: 86, title: 86, fact: 36, cta: 34, logo: 230, safe: 60 },
              '1x1': { W: 1080, H: 1080, hero: 58, seaTop: 52, seaBottom: 84, title: 78, fact: 34, cta: 32, logo: 210, safe: 60 },
              '9x16': { W: 1080, H: 1920, hero: 56, seaTop: 50, seaBottom: 80, title: 104, fact: 42, cta: 38, logo: 250, safe: 60, top: 250, bottom: 250 },
              '1200x628': { W: 1200, H: 628, hero: 100, seaTop: 0, seaBottom: 100, title: 64, fact: 30, cta: 28, logo: 170, safe: 40 } };
  const f = F[SPEC.formato] || F['4x5'];
  const r = document.documentElement.style;
  r.setProperty('--W', f.W + 'px'); r.setProperty('--H', f.H + 'px'); r.setProperty('--hero-h', f.hero + '%');
  r.setProperty('--sea-top', f.seaTop + '%'); r.setProperty('--sea-bottom', f.seaBottom + '%');
  r.setProperty('--title-size', f.title + 'px'); r.setProperty('--fact-size', f.fact + 'px'); r.setProperty('--cta-size', f.cta + 'px');
  r.setProperty('--logo-w', f.logo + 'px'); r.setProperty('--safe', f.safe + 'px');
  if (SPEC.heroPos) r.setProperty('--hero-pos', SPEC.heroPos);
  // gerador determinístico (mesmo seed = mesmo rasgo)
  let s = (SPEC.seed || 1) * 9301 + 49297; const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  // bordas rasgadas: polígono com ruído em duas escalas
  function torn(y0, amp, n, W) { const pts = []; const p1 = rnd() * 9, p2 = rnd() * 9; let drift = 0; for (let i = 0; i <= n; i++) { const t = i / n; const x = W * t; drift += (rnd() - .5) * amp * .18; drift *= .92; const y = y0 + Math.sin(t * 23 + p1) * amp * .55 + Math.sin(t * 61 + p2) * amp * .22 + drift + (rnd() - .5) * amp * .14; pts.push([x, y]); } return pts; }
  const svg = document.getElementById('sea'); const seaH = (f.seaBottom - f.seaTop + 8) / 100 * f.H; const seaW = f.W * 1.04;
  svg.setAttribute('viewBox', `0 0 ${seaW} ${seaH}`);
  const topPts = torn(seaH * .11, seaH * .085, 170, seaW); const botPts = torn(seaH * .89, seaH * .08, 170, seaW).reverse();
  const seaD = 'M' + [...topPts, ...botPts].map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + ' Z';
  const setSea = (d) => { ['seaPath', 'seaEdge', 'seaClipPath'].forEach(id => document.getElementById(id).setAttribute('d', d)); };
  setSea(seaD);
  const wm = document.getElementById('wmInner'); const wmScale = (seaH * 1.9) / 400; wm.setAttribute('transform', `translate(${seaW * .02} ${-seaH * .35}) scale(${wmScale})`);
  // 1200x628: mar à esquerda em vez de faixa (layout paisagem)
  if (SPEC.formato === '1200x628') {
    document.querySelector('.hero').style.cssText = 'left:46%;width:54%;height:100%';
    document.querySelector('.sea').style.cssText = 'left:-4%;top:-6%;width:56%;height:112%';
    svg.setAttribute('viewBox', `0 0 ${f.W * .56} ${f.H * 1.12}`);
    const tp = []; for (let i = 0; i <= 40; i++) { const y = (f.H * 1.12 * i) / 40; tp.push([f.W * .56 * .9 + (rnd() - .5) * 26 + Math.sin(i * 1.9) * 8, y]); }
    setSea('M0 0 L' + tp.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + ` L0 ${f.H * 1.12} Z`);
    wm.setAttribute('transform', `translate(${-f.W * .18} ${f.H * .05}) scale(${(f.H * 1.5) / 400})`);
    document.querySelector('.copy').style.cssText = 'left:40px;right:52%;top:60px;bottom:150px;align-items:flex-start;text-align:left';
    document.querySelector('.foot').style.cssText = 'left:40px;right:auto;width:44%;top:auto;bottom:34px;justify-content:space-between';
    document.querySelector('.wood').style.cssText = 'width:16%;right:-5%;bottom:-6%';
  }
  if (SPEC.formato === '9x16') { document.querySelector('.foot').style.bottom = f.bottom + 'px'; }
  // ticks das rosas dos ventos
  const tk = document.getElementById('ticks'); let h = ''; for (let i = 0; i < 72; i++) { const a = (i / 72) * Math.PI * 2; const R = i % 6 === 0 ? 140 : 146; h += `<line x1="${200 + Math.cos(a) * 150}" y1="${200 + Math.sin(a) * 150}" x2="${200 + Math.cos(a) * R}" y2="${200 + Math.sin(a) * R}"/>`; } tk.innerHTML = h;
  const wt = document.getElementById('wticks'); h = ''; for (let i = 0; i < 48; i++) { const a = (i / 48) * Math.PI * 2; const R = i % 4 === 0 ? 68 : 72; h += `<line x1="${100 + Math.cos(a) * 77}" y1="${100 + Math.sin(a) * 77}" x2="${100 + Math.cos(a) * R}" y2="${100 + Math.sin(a) * R}"/>`; } wt.innerHTML = h;
  // conteúdo
  document.getElementById('hero').src = SPEC.heroSrc || '';
  document.getElementById('title').textContent = SPEC.titulo || '';
  const fact = document.getElementById('fact'); if (SPEC.fato) fact.textContent = SPEC.fato; else fact.remove();
  const cta = document.getElementById('cta');
  if (SPEC.cta && SPEC.cta.texto) { const wa = SPEC.cta.tipo === 'whatsapp'; cta.innerHTML = (wa ? '<svg class="ico" viewBox="0 0 24 24" fill="#25D366"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4 5.3 5.3 0 0 0 3.2.7 2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>' : '') + '<span></span>'; cta.querySelector('span').textContent = SPEC.cta.texto; if (wa) cta.style.color = '#1E8B4C'; } else { cta.remove(); document.getElementById('foot').classList.add('center'); }
  const logos = document.getElementById('logos');
  logos.innerHTML = `<div class="logo-ee">${SPEC.logoEE || ''}</div>` + (SPEC.assinatura === 'escuna+nautitour' ? `<div class="logo-nt">${SPEC.logoNT || ''}</div>` : '');
  logos.querySelectorAll('svg').forEach(el => { el.removeAttribute('width'); el.removeAttribute('height'); el.style.width = '100%'; });
  window.__ready = Promise.all([document.fonts.ready, new Promise(res => { const im = document.getElementById('hero'); if (im.complete) res(); else { im.onload = res; im.onerror = res; } })]);
</script>
</body>
</html>
