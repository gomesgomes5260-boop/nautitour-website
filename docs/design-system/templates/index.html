<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Templates Nautitour</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #0E1E2A; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="WebChrome.jsx"></script>
<script type="text/babel" src="Templates.jsx"></script>
<script type="text/babel" src="Pages-Tour-Lancha.jsx"></script>
<script type="text/babel" src="Pages-Como-Sobre-Galeria.jsx"></script>
<script type="text/babel" src="Pages-FAQ-Contato-Conf-Aval.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas title="Templates · Nautitour">
        <DCSection id="paginas-web" title="Páginas web — site institucional completo">
          <DCArtboard id="p-tour"      label="Detalhe do passeio · Tour das Ilhas" width={1280} height={3400}>
            <TourDetailPage/>
          </DCArtboard>
          <DCArtboard id="p-lancha"    label="Lancha Privativa · premium"          width={1280} height={2800}>
            <LanchaPrivativaPage/>
          </DCArtboard>
          <DCArtboard id="p-como"      label="Como funciona · passo a passo"       width={1280} height={2400}>
            <ComoFuncionaPage/>
          </DCArtboard>
          <DCArtboard id="p-sobre"     label="Sobre · história + equipe"           width={1280} height={2600}>
            <SobrePage/>
          </DCArtboard>
          <DCArtboard id="p-galeria"   label="Galeria · masonry de fotos"          width={1280} height={2400}>
            <GaleriaPage/>
          </DCArtboard>
          <DCArtboard id="p-faq"       label="FAQ · acordeão"                      width={1280} height={2400}>
            <FAQPage/>
          </DCArtboard>
          <DCArtboard id="p-contato"   label="Contato · com mapa + form"           width={1280} height={2200}>
            <ContatoPage/>
          </DCArtboard>
          <DCArtboard id="p-conf"      label="Confirmação pós-reserva · voucher"   width={1280} height={1700}>
            <ConfirmacaoPage/>
          </DCArtboard>
          <DCArtboard id="p-aval"      label="Avaliações · 4.9 estrelas"           width={1280} height={2400}>
            <AvaliacoesPage/>
          </DCArtboard>
        </DCSection>

        <DCSection id="originals" title="Templates originais (referência)">
          <DCArtboard id="t1" label="01 · Mobile + Manhã Perfeita + Booking" width={1180} height={820}>
            <TemplateOne/>
          </DCArtboard>
          <DCArtboard id="t2" label="02 · Triple-phone composition" width={1180} height={820}>
            <TemplateTwo/>
          </DCArtboard>
          <DCArtboard id="t3" label="03 · Web hero — 12 praias. 3 ilhas." width={1280} height={820}>
            <TemplateThree/>
          </DCArtboard>
        </DCSection>

        <DCSection id="extras" title="Mobile + social">
          <DCArtboard id="ig-post" label="Instagram post (1080×1080)" width={720} height={720}>
            <InstagramPost/>
          </DCArtboard>
          <DCArtboard id="ig-story" label="Instagram story (1080×1920)" width={540} height={960}>
            <InstagramStory/>
          </DCArtboard>
          <DCArtboard id="checkout" label="Checkout mobile" width={348} height={688}>
            <CheckoutScreen/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
